<!DOCTYPE html>
<html lang="sr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dnevnik kalorija</title>
<style>
  :root{
    color-scheme: light;
    --plane:#f9f9f7; --surface:#fcfcfb; --card:#ffffff;
    --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
    --grid:#e1e0d9; --axis:#c3c2b7; --ring:rgba(11,11,11,0.10);
    --p:#2a78d6; --c:#eb6834; --f:#1baf7a;
    --good:#0ca30c; --crit:#d03b3b;
  }
  :root[data-theme="dark"]{
    color-scheme: dark;
    --plane:#0d0d0d; --surface:#1a1a19; --card:#1a1a19;
    --ink:#ffffff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --ring:rgba(255,255,255,0.10);
    --p:#3987e5; --c:#d95926; --f:#199e70;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--plane);color:var(--ink);
    font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:15px;line-height:1.45}
  .wrap{max-width:760px;margin:0 auto;padding:16px 16px 64px}
  header{display:flex;align-items:center;gap:10px;margin-bottom:14px}
  h1{font-size:17px;margin:0;font-weight:650;letter-spacing:-0.01em}
  .spacer{flex:1}
  .card{background:var(--card);border:1px solid var(--ring);border-radius:14px;padding:16px;margin-bottom:12px}
  .card h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:0 0 12px;font-weight:600}
  button{font:inherit;cursor:pointer;border-radius:9px;border:1px solid var(--ring);
    background:var(--surface);color:var(--ink);padding:8px 12px}
  button:hover{border-color:var(--axis)}
  button.ghost{background:transparent;border:none;color:var(--muted);padding:6px 8px}
  button.ghost:hover{color:var(--ink)}
  .hero{display:flex;align-items:center;gap:20px}
  .hero .fig{font-size:44px;font-weight:680;letter-spacing:-0.03em;line-height:1}
  .hero .sub{color:var(--ink2);font-size:13px;margin-top:4px}
  .donut{flex:0 0 108px}
  .bar{height:10px;background:var(--grid);border-radius:5px;overflow:hidden;margin-top:6px}
  .bar>i{display:block;height:100%;border-radius:5px}
  .mrow{margin-bottom:12px}
  .mrow:last-child{margin-bottom:0}
  .mhead{display:flex;justify-content:space-between;font-size:13px}
  .mhead b{font-weight:600}
  .dot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:7px;vertical-align:1px}
  .meal{margin-bottom:14px}
  .meal>h3{font-size:13px;font-weight:650;margin:0 0 6px;display:flex;justify-content:space-between;color:var(--ink2)}
  .item{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--grid);font-size:14px}
  .item .nm{flex:1;min-width:0}
  .item .nm small{display:block;color:var(--muted);font-size:11.5px}
  .item .kc{font-variant-numeric:tabular-nums;font-weight:600}
  .empty{color:var(--muted);font-size:13px;font-style:italic;padding:4px 0}
  .datebar{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .datebar .d{flex:1;text-align:center;font-weight:600;font-size:14px}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:right;padding:5px 4px;font-variant-numeric:tabular-nums;border-bottom:1px solid var(--grid)}
  th:first-child,td:first-child{text-align:left}
  th{color:var(--muted);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em}
  .over{color:var(--crit)}
  .ok{color:var(--good)}
  .hint{font-size:12px;color:var(--muted)}
  .lock{max-width:340px;margin:48px auto 0}
  .lock p{color:var(--ink2);font-size:13px;margin:0 0 14px}
  .lock input[type=password]{width:100%;font:inherit;padding:9px 11px;border-radius:9px;
    border:1px solid var(--ring);background:var(--surface);color:var(--ink);margin-bottom:10px}
  .lock input[type=password]:focus{outline:none;border-color:var(--axis)}
  .lock .row{display:flex;align-items:center;gap:8px;justify-content:space-between}
  .lock label{font-size:12.5px;color:var(--muted);display:flex;align-items:center;gap:6px}
  .lock .msg{font-size:12.5px;margin-top:10px;min-height:16px}
  svg text{font-family:inherit}
  @media(max-width:520px){.hero{gap:14px}.hero .fig{font-size:36px}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Dnevnik kalorija</h1>
    <div class="spacer"></div>
    <button class="ghost" id="lockBtn" title="Zaključaj i zaboravi lozinku" style="display:none">⎋</button>
    <button class="ghost" id="themeBtn" title="Svetla/tamna tema">◐</button>
  </header>

  <main id="app" style="display:none">
    <div class="datebar">
      <button id="prevDay">‹</button>
      <div class="d" id="dayLabel"></div>
      <button id="nextDay">›</button>
    </div>

    <div class="card">
      <div class="hero">
        <div class="donut"><svg viewBox="0 0 100 100" width="108" height="108" aria-hidden="true">
          <circle cx="50" cy="50" r="42" fill="none" stroke="var(--grid)" stroke-width="11"/>
          <circle id="ring" cx="50" cy="50" r="42" fill="none" stroke="var(--p)" stroke-width="11"
                  stroke-linecap="round" transform="rotate(-90 50 50)" stroke-dasharray="0 264"/>
        </svg></div>
        <div>
          <div class="fig" id="kcalNow">0</div>
          <div class="sub" id="kcalSub"></div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>Makronutrijenti</h2>
      <div class="mrow"><div class="mhead"><span><span class="dot" style="background:var(--p)"></span>Proteini</span><b id="pTxt"></b></div><div class="bar"><i id="pBar" style="background:var(--p)"></i></div></div>
      <div class="mrow"><div class="mhead"><span><span class="dot" style="background:var(--c)"></span>Ugljeni hidrati</span><b id="cTxt"></b></div><div class="bar"><i id="cBar" style="background:var(--c)"></i></div></div>
      <div class="mrow"><div class="mhead"><span><span class="dot" style="background:var(--f)"></span>Masti</span><b id="fTxt"></b></div><div class="bar"><i id="fBar" style="background:var(--f)"></i></div></div>
    </div>

    <div class="card">
      <h2 id="logTitle">Obroci</h2>
      <div id="log"></div>
    </div>

    <div class="card" id="wCard" style="display:none">
      <h2>Težina</h2>
      <div class="hero">
        <div>
          <div class="fig" id="wNow">—</div>
          <div class="sub" id="wSub"></div>
        </div>
      </div>
      <div id="wChart" style="margin-top:14px"></div>
    </div>

    <div class="card">
      <h2>Poslednjih 7 dana</h2>
      <div id="chart"></div>
      <table id="weekTable" style="margin-top:12px"></table>
    </div>

    <p class="hint" id="updated"></p>
  </main>

  <div id="lock" class="card lock" style="display:none">
    <h2>Zaključano</h2>
    <p>Podaci su šifrovani. Unesi lozinku da otključaš dnevnik.</p>
    <form id="lockForm">
      <input type="password" id="pw" autocomplete="current-password" placeholder="Lozinka" autofocus>
      <div class="row">
        <label><input type="checkbox" id="remember"> Zapamti na ovom uređaju</label>
        <button type="submit" id="unlock">Otključaj</button>
      </div>
      <div class="msg" id="lockMsg"></div>
    </form>
  </div>

  <div id="err" class="card" style="display:none">
    <h2>Nema podataka</h2>
    <p class="hint" style="margin:0">Još nema <code>data.json</code> fajla, ili stranica ne može da ga učita. Podatke ažurira Claude — javi mu šta si jeo.</p>
  </div>
</div>

<script>
let S=null, cur=todayKey();
const MEALS=["Doručak","Ručak","Večera","Užina"];
const $=id=>document.getElementById(id);
const r0=n=>Math.round(n), r1=n=>Math.round(n*10)/10;

function todayKey(d){ d=d||new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function keyShift(k,n){ const [y,m,d]=k.split("-").map(Number); return todayKey(new Date(y,m-1,d+n)); }
function fmtDate(k){
  const [y,m,d]=k.split("-").map(Number); const dt=new Date(y,m-1,d);
  const dani=["nedelja","ponedeljak","utorak","sreda","četvrtak","petak","subota"];
  const mes=["jan","feb","mar","apr","maj","jun","jul","avg","sep","okt","nov","dec"];
  let pre=k===todayKey()?"Danas · ":(k===keyShift(todayKey(),-1)?"Juče · ":"");
  return pre+dani[dt.getDay()]+", "+d+". "+mes[m-1];
}
function totals(k){ return (S.days[k]||[]).reduce((a,e)=>({kcal:a.kcal+e.kcal,p:a.p+e.p,c:a.c+e.c,f:a.f+e.f}),{kcal:0,p:0,c:0,f:0}); }
function setBar(el,txt,val,tar,unit){
  $(el).style.width=(tar?Math.min(100,val/tar*100):0)+"%";
  $(txt).textContent=r0(val)+" / "+tar+" "+unit;
  $(txt).className=val>tar*1.05?"over":"";
}
function render(){
  const T=S.profile, t=totals(cur);
  $("dayLabel").textContent=fmtDate(cur);
  $("kcalNow").textContent=r0(t.kcal);
  const left=T.kcal-t.kcal;
  $("kcalSub").innerHTML=left>=0
    ?`od <b>${T.kcal} kcal</b> · ostalo <span class="ok"><b>${r0(left)}</b></span>`
    :`od <b>${T.kcal} kcal</b> · <span class="over"><b>${r0(-left)} preko cilja</b></span>`;
  const circ=2*Math.PI*42, frac=Math.min(1,t.kcal/T.kcal), ring=$("ring");
  ring.setAttribute("stroke-dasharray",(circ*frac).toFixed(1)+" "+circ.toFixed(1));
  ring.setAttribute("stroke",left>=0?"var(--p)":"var(--crit)");
  setBar("pBar","pTxt",t.p,T.p,"g"); setBar("cBar","cTxt",t.c,T.c,"g"); setBar("fBar","fTxt",t.f,T.f,"g");

  const L=$("log"); L.innerHTML="";
  const items=S.days[cur]||[];
  $("logTitle").textContent=cur===todayKey()?"Šta si jeo danas":"Obroci";
  if(!items.length) L.innerHTML='<div class="empty">Nema unosa za ovaj dan.</div>';
  MEALS.forEach(m=>{
    const xs=items.filter(e=>e.meal===m);
    if(!xs.length) return;
    const div=document.createElement("div"); div.className="meal";
    div.innerHTML=`<h3><span>${m}</span><span>${r0(xs.reduce((a,e)=>a+e.kcal,0))} kcal</span></h3>`+
      xs.map(e=>`<div class="item"><div class="nm">${e.name}<small>${e.note||""}${e.note?" · ":""}B ${r1(e.p)} · UH ${r1(e.c)} · M ${r1(e.f)}</small></div><div class="kc">${r0(e.kcal)}</div></div>`).join("");
    L.appendChild(div);
  });
  drawWeek(T.kcal);
  drawWeight();
  if(S.updated) $("updated").textContent="Poslednje ažuriranje: "+S.updated;
}
function wKeys(){ return Object.keys(S.weights||{}).filter(k=>S.weights[k]>0).sort(); }
function wAvg(end,n){
  const start=keyShift(end,-(n-1));
  const vs=wKeys().filter(k=>k>=start&&k<=end).map(k=>S.weights[k]);
  return vs.length?{avg:vs.reduce((a,b)=>a+b,0)/vs.length,n:vs.length}:null;
}
function drawWeight(){
  const ks=wKeys().filter(k=>k<=cur);
  if(!ks.length){ $("wCard").style.display="none"; return; }
  $("wCard").style.display="block";
  const last=ks[ks.length-1], w=S.weights[last];
  $("wNow").textContent=w.toFixed(1)+" kg";
  const a=wAvg(cur,7), prev=wAvg(keyShift(cur,-7),7);
  let sub=last===cur?"jutros":("mereno "+fmtDate(last).replace("Danas · ","").replace("Juče · ",""));
  if(a) sub+=` · 7-dnevni prosek <b>${a.avg.toFixed(1)} kg</b> <span class="hint">(${a.n} mer.)</span>`;
  if(a&&prev){
    const dlt=a.avg-prev.avg, cls=Math.abs(dlt)<0.05?"":(dlt<0?"ok":"over");
    sub+=` · <span class="${cls}"><b>${dlt>0?"+":""}${dlt.toFixed(1)} kg</b></span> vs. prethodnih 7 dana`;
  }
  $("wSub").innerHTML=sub;

  const from=keyShift(cur,-29);
  const pts=wKeys().filter(k=>k>=from&&k<=cur).map(k=>({k,v:S.weights[k]}));
  if(pts.length<2){ $("wChart").innerHTML=""; return; }
  const W=680,H=140,padL=6,padR=42,padT=14,padB=22;
  const vs=pts.map(p=>p.v), lo=Math.min(...vs)-0.4, hi=Math.max(...vs)+0.4;
  const dayNo=k=>{const[y,m,d]=k.split("-").map(Number);return Date.UTC(y,m-1,d)/864e5;};
  const x0=dayNo(pts[0].k), span=Math.max(1,dayNo(pts[pts.length-1].k)-x0);
  const X=k=>padL+(dayNo(k)-x0)/span*(W-padL-padR);
  const Y=v=>padT+(hi-v)/(hi-lo)*(H-padT-padB);
  const line=pts.map((p,i)=>(i?"L":"M")+X(p.k).toFixed(1)+" "+Y(p.v).toFixed(1)).join(" ");
  const dots=pts.map(p=>`<circle cx="${X(p.k).toFixed(1)}" cy="${Y(p.v).toFixed(1)}" r="3" fill="var(--f)"><title>${fmtDate(p.k).replace("Danas · ","").replace("Juče · ","")}: ${p.v.toFixed(1)} kg</title></circle>`).join("");
  let avgLine="";
  if(a){ const ya=Y(a.avg);
    avgLine=`<line x1="${padL}" x2="${W-padR}" y1="${ya.toFixed(1)}" y2="${ya.toFixed(1)}" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="5 4"/>`+
            `<text x="${W-padR+4}" y="${(ya+3.5).toFixed(1)}" font-size="10.5" fill="var(--muted)">${a.avg.toFixed(1)}</text>`; }
  $("wChart").innerHTML=
    `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Težina u poslednjih 30 dana">
       ${avgLine}
       <path d="${line}" fill="none" stroke="var(--f)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
       ${dots}
       <text x="${padL}" y="${H-6}" font-size="10.5" fill="var(--muted)">${pts[0].k.slice(8)}.${pts[0].k.slice(5,7)}.</text>
       <text x="${W-padR}" y="${H-6}" text-anchor="end" font-size="10.5" fill="var(--muted)">${pts[pts.length-1].k.slice(8)}.${pts[pts.length-1].k.slice(5,7)}.</text>
     </svg>`;
}
function drawWeek(target){
  const keys=[]; for(let i=6;i>=0;i--) keys.push(keyShift(cur,-i));
  const vals=keys.map(k=>totals(k).kcal);
  const max=Math.max(target*1.25,...vals,100);
  const W=680,H=170,padL=6,padR=6,padT=14,padB=26;
  const bw=(W-padL-padR)/7, gap=10, plotH=H-padT-padB;
  const y=v=>padT+plotH-(v/max)*plotH;
  const dani=["ned","pon","uto","sre","čet","pet","sub"];
  let bars="";
  keys.forEach((k,i)=>{
    const v=vals[i], x=padL+i*bw+gap/2, w=bw-gap;
    const [Y,M,D]=k.split("-").map(Number), lbl=dani[new Date(Y,M-1,D).getDay()];
    const col=v===0?"var(--grid)":(v>target?"var(--crit)":"var(--p)");
    const h=v===0?2:Math.max(3,plotH-(y(v)-padT));
    bars+=`<rect x="${x}" y="${padT+plotH-h}" width="${w}" height="${h}" rx="4" fill="${col}"><title>${fmtDate(k)}: ${r0(v)} kcal</title></rect>`;
    if(v>0) bars+=`<text x="${x+w/2}" y="${padT+plotH-h-5}" text-anchor="middle" font-size="11" font-weight="600" fill="var(--ink2)">${r0(v)}</text>`;
    bars+=`<text x="${x+w/2}" y="${H-8}" text-anchor="middle" font-size="11" fill="var(--muted)">${lbl}</text>`;
  });
  const ty=y(target);
  $("chart").innerHTML=
    `<svg viewBox="0 0 ${W} ${H}" width="100%" height="${H}" role="img" aria-label="Kalorije po danima u poslednjih 7 dana">
       <line x1="${padL}" x2="${W-padR}" y1="${ty}" y2="${ty}" stroke="var(--axis)" stroke-width="1.5" stroke-dasharray="5 4"/>
       <text x="${W-padR}" y="${ty-5}" text-anchor="end" font-size="10.5" fill="var(--muted)">cilj ${target}</text>
       ${bars}
       <line x1="${padL}" x2="${W-padR}" y1="${padT+plotH}" y2="${padT+plotH}" stroke="var(--axis)" stroke-width="1"/>
     </svg>`;
  let rows=`<tr><th>Dan</th><th>kcal</th><th>Bel.</th><th>UH</th><th>Masti</th></tr>`;
  const done=keys.filter(k=>totals(k).kcal>0);
  done.forEach(k=>{ const t=totals(k);
    rows+=`<tr><td>${fmtDate(k).replace("Danas · ","").replace("Juče · ","")}</td><td class="${t.kcal>target?'over':''}">${r0(t.kcal)}</td><td>${r0(t.p)}</td><td>${r0(t.c)}</td><td>${r0(t.f)}</td></tr>`; });
  if(done.length>1){ const avg=done.reduce((a,k)=>a+totals(k).kcal,0)/done.length;
    rows+=`<tr><td><b>Prosek (${done.length} dana)</b></td><td colspan="4" style="text-align:left"><b>${r0(avg)} kcal</b></td></tr>`; }
  $("weekTable").innerHTML=done.length?rows:"";
}
$("prevDay").onclick=()=>{cur=keyShift(cur,-1);render();};
$("nextDay").onclick=()=>{if(cur<todayKey()){cur=keyShift(cur,1);render();}};
$("lockBtn").onclick=()=>{ localStorage.removeItem(PW_KEY); location.reload(); };
$("themeBtn").onclick=()=>{
  const d=document.documentElement.getAttribute("data-theme")==="dark";
  document.documentElement.setAttribute("data-theme",d?"light":"dark");
};
if(matchMedia("(prefers-color-scheme: dark)").matches) document.documentElement.setAttribute("data-theme","dark");

const b64d=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function decrypt(blob,pass){
  const km=await crypto.subtle.importKey("raw",new TextEncoder().encode(pass),"PBKDF2",false,["deriveKey"]);
  const key=await crypto.subtle.deriveKey(
    {name:"PBKDF2",salt:b64d(blob.salt),iterations:blob.iter,hash:"SHA-256"},
    km,{name:"AES-GCM",length:256},false,["decrypt"]);
  const pt=await crypto.subtle.decrypt({name:"AES-GCM",iv:b64d(blob.iv)},key,b64d(blob.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function start(d){ S=d; $("lock").style.display="none"; $("app").style.display="block";
  if(localStorage.getItem(PW_KEY)) $("lockBtn").style.display="inline-block";
  render(); }
const PW_KEY="dnevnik_pw";

async function boot(){
  let blob=null;
  try{ const r=await fetch("data.enc.json?ts="+Date.now()); if(r.ok) blob=await r.json(); }catch(e){}
  if(blob&&blob.ct){
    if(!crypto.subtle){ $("err").style.display="block"; return; }
    const saved=localStorage.getItem(PW_KEY);
    if(saved){ try{ return start(await decrypt(blob,saved)); }catch(e){ localStorage.removeItem(PW_KEY); } }
    $("lock").style.display="block"; $("pw").focus();
    $("lockForm").onsubmit=async e=>{
      e.preventDefault();
      const pass=$("pw").value; if(!pass) return;
      $("lockMsg").textContent="Dešifrujem…"; $("lockMsg").className="msg hint";
      try{
        const d=await decrypt(blob,pass);
        if($("remember").checked) localStorage.setItem(PW_KEY,pass);
        start(d);
      }catch(err){
        $("lockMsg").textContent="Pogrešna lozinka."; $("lockMsg").className="msg over";
        $("pw").select();
      }
    };
    return;
  }
  try{
    const r=await fetch("data.json?ts="+Date.now());
    if(!r.ok) throw 0;
    start(await r.json());
  }catch(e){ $("err").style.display="block"; }
}
boot();
</script>
</body>
</html>
